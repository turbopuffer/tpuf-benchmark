name = "clickbench"
namespaces = 1
duration = "10m"
description = """
ClickBench hits table (99,997,497 rows of Yandex.Metrica page views).

Documents store all 105 hits columns; only the columns that ClickBench queries
filter, group, or order on are filterable. Query `qN` is ClickBench query QN
(0-based, as in ClickBench's queries.sql).
"""

[setup]
wait_for_indexing = true
warm_cache = true
wait_for_cache_hit_ratio = 1.00
document_count = 99_997_497
datasource = "ClickBench"
